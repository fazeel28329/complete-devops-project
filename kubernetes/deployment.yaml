apiVersion: apps/v1
kind: Deployment
metadata:
  name: complete-devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: complete-devops-app
  template:
    metadata:
      labels:
        app: complete-devops-app
    spec:
      containers:
        - name: java-web-app
          image: complete-devops-app:2.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
